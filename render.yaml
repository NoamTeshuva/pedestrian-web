services:
  # =========================
  # Backend API (Flask)
  # =========================
  - type: web
    name: pedestrian-api-web          # unique name so it won't attach to the old service
    runtime: python
    rootDir: api
    plan: starter                     # Instance: 4 vCPU, 8 GB RAM
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: |
      set -e
      pip install --upgrade pip
      pip install -r requirements.txt
      (git lfs install && git lfs pull) || true
    # Gunicorn optimized for 4 vCPU / 8 GB RAM:
    # - 8 workers (2 per CPU core) × 2 threads = 16 concurrent requests
    # - Increased from 4 workers to handle 40+ concurrent logins
    # - Login is lightweight (auth only), predictions triggered separately by user actions
    # - Timeout 900s (15 min) for heavy prediction endpoints, but login completes in <1s
    startCommand: gunicorn app:app --workers 8 --threads 2 --timeout 900 --graceful-timeout 120 --bind 0.0.0.0:$PORT
    # Free plan has no persistent disk; write temp exports to /tmp
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONWARNINGS
        value: "ignore:::pyproj.transformer,ignore:::osmnx._nominatim,ignore:::osmnx._overpass"
      - key: DATA_DIR
        value: /tmp
      - key: CORS_ORIGINS
        # after first deploy, replace with your actual frontend URL shown by Render
        value: https://pedestrian-frontend-web.onrender.com,http://localhost:3000

      # Vultr Object Storage Configuration
      # IMPORTANT: Set secrets (S3_ACCESS_KEY, S3_SECRET_KEY) via Render Dashboard only!
      # Never commit secrets to git. Add them at: Dashboard → Service → Environment

      - key: USE_S3_STORAGE
        value: "true"  # Secrets are in Render Dashboard
      - key: S3_ENDPOINT
        value: "https://ams1.vultrobjects.com"
      - key: S3_BUCKET
        value: "pedestrian-data-prod"
      - key: S3_REGION
        value: "us-east-1"

  # =========================
  # Frontend (Static, Free)
  # =========================
  - type: web
    name: pedestrian-frontend-web     # unique name
    runtime: static
    rootDir: frontend
    staticPublishPath: .
    autoDeploy: true
