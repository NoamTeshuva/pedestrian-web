<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חיזוי נפח הולכי רגל</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Full screen map -->
    <div id="map" class="fullscreen-map"></div>

    <!-- Right Search Panel -->
    <div class="right-panel" id="searchPanel">
        <div class="panel-header">
            <h1>חיזוי נפח הולכי רגל</h1>
            <button class="panel-collapse-btn" id="panelCollapseBtn">
                <span class="collapse-icon">X</span>
            </button>
        </div>
        
        <div class="panel-content">
            <!-- Row 1: City Search -->
            <div class="panel-row">
                <input 
                    type="text"
                    id="citySearchInput"
                    placeholder="הזן שם עיר לחיפוש"
                    class="city-input"
                />
                <button id="searchCityBtn" class="panel-btn primary-btn">
                    <span id="searchCityBtnText"> חיזוי עיר</span>
                    <span id="searchCitySpinner" class="spinner hidden">⌛</span>
                </button>
            </div>

            <!-- Row 2: Local Navigation & BBox Tools -->
            <div class="panel-row">
                <button id="findCityBtn" class="panel-btn">
                    מצא עיר (ללא חיזוי)
                </button>
                <button id="drawBboxBtn" class="panel-btn">
                    סמן אזור
                </button>
                <button id="clearBboxBtn" class="panel-btn danger-btn" disabled>
                    מחק אזור
                </button>
            </div>

            <!-- Row 3: BBox Actions -->
            <div class="panel-row">
                <button id="sendBboxBtn" class="panel-btn primary-btn" disabled>
                    <span id="sendBboxBtnText">חיזוי אזור מסומן</span>
                    <span id="sendBboxSpinner" class="spinner hidden">⌛</span>
                </button>
            </div>

			<!-- Row 4: GPKG Upload -->
            <div class="panel-row">
                <label class="file-btn">
                    בחר קובץ GPKG
                    <input id="gpkgFileInput" type="file" accept=".gpkg" />
                </label>
                <button id="uploadGpkgBtn" class="panel-btn" disabled>
                    <span id="uploadGpkgBtnText">שלח קובץ</span>
                    <span id="uploadGpkgSpinner" class="spinner hidden">⌛</span>
                </button>
            </div>

            <!-- Progress Section (shown during batch processing) -->
            <div id="progressSection" class="progress-section hidden">
                <h3>מעבד חיזויים...</h3>
                <div class="progress-bar">
                    <div id="progressBar" class="progress-fill"></div>
                </div>
                <div id="progressText" class="progress-text">0 / 32</div>
            </div>

            <!-- Layer Selection (shown after data loaded) -->
            <div id="layerSelectionSection" class="layer-selection hidden">
                <div class="layer-selection-header">
                    <h3>בחר שכבה להצגה:</h3>
                    <button id="clearLayersBtn" class="clear-layers-btn">
                        הסר שכבה
                    </button>
                </div>
                <div id="layerButtonsContainer" class="layer-buttons"></div>
            </div>

            <!-- Weather Summary Section (shown after predictions loaded) -->
            <div id="weatherSummarySection" class="weather-summary hidden">
                <h3>סיכום תנאי מזג אוויר:</h3>
                <div id="weatherSummaryContent" class="weather-summary-content"></div>
            </div>

            <!-- Download Section (shown after data loaded) -->
            <div id="downloadSection" class="download-section hidden">
                <button id="downloadGpkgBtn" class="panel-btn success-btn">
                    <span id="downloadBtnText">הורד GPKG עם כל השכבות</span>
                    <span id="downloadSpinner" class="spinner hidden">⌛</span>
                </button>
            </div>

            <!-- Status Messages -->
            <div id="statusMessage" class="status-message hidden"></div>
        </div>
    </div>

    <!-- Floating Details Panel -->
    <div id="detailsPanel" class="floating-panel details-panel">
        <div class="panel-header">
            <h3 id="cityName">שם העיר</h3>
            <span id="streetCount" class="street-count">0 רחובות</span>
        </div>
        <div class="panel-content" id="detailsPanelContent">
            <h4 id="layerName">שם השכבה</h4>
        </div>
    </div>

    <!-- Floating Legend -->
    <div class="floating-legend">
        <h4>מקרא:</h4>
        <div id="legendItems"></div>
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Leaflet Draw -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    
    <!-- API base resolver (NOTE: script.js also handles API selection independently) -->
    <script>
        (function () {
            const url = new URL(window.location.href);
            const fromQuery = url.searchParams.get('api');
            if (fromQuery) localStorage.setItem('apiBase', fromQuery);

            const ls = localStorage.getItem('apiBase');
            const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

            // Updated to use new backend URL
            window.API_BASE = ls || (isLocal ? 'http://127.0.0.1:8000' : 'https://pedestrian-web.onrender.com');
            console.log('[API_BASE]', window.API_BASE);
        })();
    </script>

    <!-- Custom JavaScript -->
    <script src="script.js" defer></script>
</body>
</html>
