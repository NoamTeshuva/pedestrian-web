<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חיזוי נפח הולכי רגל</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Full screen map -->
    <div id="map" class="fullscreen-map"></div>

    <!-- Login Popup (centered) -->
    <div class="login-popup" id="loginPopup">
        <div class="login-popup-content">
            <h3>התחברות למערכת</h3>
            <div class="form-field">
                <label for="loginUsername">שם משתמש:</label>
                <input
                    type="text"
                    id="loginUsername"
                    placeholder="user1, user2..."
                    autocomplete="username"
                />
            </div>
            <div class="form-field">
                <label for="loginPassword">סיסמה:</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="הזן סיסמה"
                    autocomplete="current-password"
                />
            </div>
            <button id="loginSubmitBtn" class="login-submit-btn">כניסה</button>
            <div id="loginError" class="login-error hidden"></div>
        </div>
    </div>

    <!-- Right Search Panel -->
    <div class="right-panel" id="searchPanel">
        <div class="panel-header">
            <h1>חיזוי נפח הולכי רגל</h1>
            <button class="panel-collapse-btn" id="panelCollapseBtn">
                <span class="collapse-icon">X</span>
            </button>
        </div>

        <!-- User Info Bar -->
        <div class="user-info-bar" id="userInfoBar">
            <div class="user-details">
                <span class="user-greeting">שלום, <strong id="userFullName"></strong></span>
                <span class="user-role-badge" id="userRoleBadge"></span>
            </div>
            <button class="logout-btn" id="logoutBtn">יציאה</button>
        </div>
        
        <div class="panel-content">
            <!-- Row 1: City Search -->
            <div class="panel-row">
                <input 
                    type="text"
                    id="citySearchInput"
                    placeholder="הזן שם עיר לחיפוש"
                    class="city-input"
                />
                <button id="searchCityBtn" class="panel-btn primary-btn">
                    <span id="searchCityBtnText"> חיזוי עיר</span>
                    <span id="searchCitySpinner" class="spinner hidden">⌛</span>
                </button>
            </div>

            <!-- Row 2: Local Navigation & BBox Tools -->
            <div class="panel-row">
                <button id="findCityBtn" class="panel-btn">
                    מצא עיר (ללא חיזוי)
                </button>
                <button id="drawBboxBtn" class="panel-btn">
                    סמן אזור
                </button>
                <button id="clearBboxBtn" class="panel-btn danger-btn" disabled>
                    מחק אזור
                </button>
            </div>

            <!-- Row 3: BBox Actions -->
            <div class="panel-row">
                <button id="sendBboxBtn" class="panel-btn primary-btn" disabled>
                    <span id="sendBboxBtnText">חיזוי אזור מסומן</span>
                    <span id="sendBboxSpinner" class="spinner hidden">⌛</span>
                </button>
            </div>

			<!-- Row 4: GPKG Upload -->
            <div class="panel-row">
                <label class="file-btn">
                    בחר קובץ GPKG
                    <input id="gpkgFileInput" type="file" accept=".gpkg" />
                </label>
                <button id="uploadGpkgBtn" class="panel-btn" disabled>
                    <span id="uploadGpkgBtnText">שלח קובץ</span>
                    <span id="uploadGpkgSpinner" class="spinner hidden">⌛</span>
                </button>
            </div>

            <!-- Progress Section (shown during batch processing) -->
            <div id="progressSection" class="progress-section hidden">
                <h3>מעבד חיזויים...</h3>
                <div class="progress-bar">
                    <div id="progressBar" class="progress-fill"></div>
                </div>
                <div id="progressText" class="progress-text">0 / 32</div>
            </div>

            <!-- Layer Selection (shown after data loaded) -->
            <div id="layerSelectionSection" class="layer-selection hidden">
                <div class="layer-selection-header">
                    <h3>בחר שכבה להצגה:</h3>
                    <button id="clearLayersBtn" class="clear-layers-btn">
                        הסר שכבה
                    </button>
                </div>
                <div id="layerButtonsContainer" class="layer-buttons"></div>
            </div>

            <!-- Weather Summary Section (shown after predictions loaded) -->
            <div id="weatherSummarySection" class="weather-summary hidden">
                <h3>סיכום תנאי מזג אוויר:</h3>
                <div id="weatherSummaryContent" class="weather-summary-content"></div>
            </div>

            <!-- Download Section (shown after data loaded) -->
            <div id="downloadSection" class="download-section hidden">
                <button id="downloadGpkgBtn" class="panel-btn success-btn">
                    <span id="downloadBtnText">הורד GPKG עם כל השכבות</span>
                    <span id="downloadSpinner" class="spinner hidden">⌛</span>
                </button>
            </div>

            <!-- Status Messages -->
            <div id="statusMessage" class="status-message hidden"></div>
        </div>
    </div>

    <!-- Floating Details Panel -->
    <div id="detailsPanel" class="floating-panel details-panel">
        <div class="panel-header">
            <h3 id="cityName">שם העיר</h3>
            <span id="streetCount" class="street-count">0 רחובות</span>
        </div>
        <div class="panel-content" id="detailsPanelContent">
            <h4 id="layerName">שם השכבה</h4>
        </div>
    </div>

    <!-- Floating Legend -->
    <div class="floating-legend">
        <h4>מקרא:</h4>
        <div id="legendItems"></div>
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Leaflet Draw -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    
    <!-- API base resolver (NOTE: script.js also handles API selection independently) -->
    <script>
        (function () {
            const url = new URL(window.location.href);
            const fromQuery = url.searchParams.get('api');
            if (fromQuery) localStorage.setItem('apiBase', fromQuery);

            const ls = localStorage.getItem('apiBase');
            const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

            // Updated to use new backend URL
            window.API_BASE = ls || (isLocal ? 'http://127.0.0.1:8000' : 'https://pedestrian-web.onrender.com');
            console.log('[API_BASE]', window.API_BASE);
        })();
    </script>

    <!-- Authentication Check and Login Popup -->
    <script>
        (function () {
            // Check if user is logged in
            const currentUserStr = localStorage.getItem('currentUser');

            document.addEventListener('DOMContentLoaded', function() {
                const loginPopup = document.getElementById('loginPopup');
                const loginUsername = document.getElementById('loginUsername');
                const loginPassword = document.getElementById('loginPassword');
                const loginSubmitBtn = document.getElementById('loginSubmitBtn');
                const loginError = document.getElementById('loginError');
                const userInfoBar = document.getElementById('userInfoBar');
                const userFullName = document.getElementById('userFullName');
                const userRoleBadge = document.getElementById('userRoleBadge');
                const logoutBtn = document.getElementById('logoutBtn');

                function showLogin() {
                    loginPopup.classList.remove('hidden');
                    userInfoBar.classList.add('hidden');
                    loginUsername.focus();
                }

                function hideLogin() {
                    loginPopup.classList.add('hidden');
                    userInfoBar.classList.remove('hidden');
                }

                function showError(message) {
                    loginError.textContent = message;
                    loginError.classList.remove('hidden');
                }

                function hideError() {
                    loginError.classList.add('hidden');
                }

                async function performLogin(username, password) {
                    hideError();
                    loginSubmitBtn.disabled = true;
                    loginSubmitBtn.textContent = 'מתחבר...';

                    try {
                        const response = await fetch(`${window.API_BASE}/api/login`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(data.error || 'שגיאה בהתחברות');
                        }

                        // Login successful
                        window.CURRENT_USER = data.user;
                        localStorage.setItem('currentUser', JSON.stringify(data.user));
                        localStorage.setItem('username', username);

                        // Display user info
                        userFullName.textContent = data.user.full_name || data.user.username;
                        const roleText = data.user.role === 'admin' ? 'מנהל' : 'סטודנט';
                        userRoleBadge.textContent = roleText;
                        userRoleBadge.className = `user-role-badge role-${data.user.role}`;

                        // Clear password field
                        loginPassword.value = '';

                        hideLogin();
                        console.log('[AUTH] Logged in as:', data.user.username, `(${data.user.full_name})`);

                    } catch (error) {
                        console.error('Login error:', error);
                        showError(error.message || 'שם משתמש או סיסמה שגויים');
                    } finally {
                        loginSubmitBtn.disabled = false;
                        loginSubmitBtn.textContent = 'כניסה';
                    }
                }

                // Login button click
                loginSubmitBtn.addEventListener('click', function() {
                    const username = loginUsername.value.trim();
                    const password = loginPassword.value;

                    if (!username) {
                        showError('נא להזין שם משתמש');
                        return;
                    }
                    if (!password) {
                        showError('נא להזין סיסמה');
                        return;
                    }

                    performLogin(username, password);
                });

                // Enter key in password field
                loginPassword.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        loginSubmitBtn.click();
                    }
                });

                // Enter key in username field
                loginUsername.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        loginPassword.focus();
                    }
                });

                // Logout functionality
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', function() {
                        if (confirm('האם אתה בטוח שברצונך להתנתק?')) {
                            localStorage.removeItem('currentUser');
                            localStorage.removeItem('username');
                            window.CURRENT_USER = null;
                            loginUsername.value = '';
                            loginPassword.value = '';
                            showLogin();
                        }
                    });
                }

                // Check if already logged in
                if (currentUserStr) {
                    try {
                        const currentUser = JSON.parse(currentUserStr);
                        window.CURRENT_USER = currentUser;

                        userFullName.textContent = currentUser.full_name || currentUser.username;
                        const roleText = currentUser.role === 'admin' ? 'מנהל' : 'סטודנט';
                        userRoleBadge.textContent = roleText;
                        userRoleBadge.className = `user-role-badge role-${currentUser.role}`;

                        hideLogin();
                        console.log('[AUTH] Already logged in as:', currentUser.username);
                    } catch (error) {
                        console.error('[AUTH] Invalid user data');
                        localStorage.removeItem('currentUser');
                        showLogin();
                    }
                } else {
                    showLogin();
                }
            });
        })();
    </script>

    <!-- Custom JavaScript -->
    <script src="script.js" defer></script>
</body>
</html>
